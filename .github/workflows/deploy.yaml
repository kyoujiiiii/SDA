name: Build & Deploy

on:
  push:
    branches: [master]

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: kyoujiiiii

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      back:  ${{ steps.filter.outputs.back }}
      front: ${{ steps.filter.outputs.front }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            back:
              - 'back/**'
              - 'core/**'
            front:
              - 'front/**'
  test-back:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r back/requirements.txt -r autotests/requirements.txt
      - run: python -m spacy download en_core_web_lg
      - run: pytest autotests/backend autotests/core

  build-back:
    needs: [changes, test-back]
    if: needs.changes.outputs.back == 'true' && needs.test-back.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push back
        uses: docker/build-push-action@v6
        with:
          context: .
          file: back/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/bernhack-back:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/bernhack-back:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-front:
    needs: [changes, test-back]
    if: needs.changes.outputs.front == 'true' && needs.test-back.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push front
        uses: docker/build-push-action@v6
        with:
          context: .
          file: front/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/bernhack-front:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/bernhack-front:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [changes, build-back, build-front]
    if: |
      always() &&
      (needs.build-back.result == 'success' || needs.build-front.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Rollout back
        if: needs.build-back.result == 'success'
        run: |
          kubectl -n bernhack set image deploy/back \
            back=${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/bernhack-back:${{ github.sha }}
          kubectl -n bernhack rollout status deploy/back --timeout=5m

      - name: Rollout front
        if: needs.build-front.result == 'success'
        run: |
          kubectl -n bernhack set image deploy/front \
            front=${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/bernhack-front:${{ github.sha }}
          kubectl -n bernhack rollout status deploy/front --timeout=5m