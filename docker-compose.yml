services:
  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  back:
    build:
      context: .
      dockerfile: back/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - NVAPI_KEY=${NVAPI_KEY:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://integrate.api.nvidia.com/v1}
      - LLM_MODEL=${LLM_MODEL:-meta/llama-3.1-8b-instruct}
      - REDIS_URL=redis://redis:6379/0
      - SESSION_TTL=${SESSION_TTL:-3600}
      - DATABASE_PATH=/data/airlock_audit.db
      - APP_HOST=0.0.0.0
      - APP_PORT=8000
    volumes:
      - audit-data:/data
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  front:
    build:
      context: .
      dockerfile: front/Dockerfile
    ports:
      - "8081:80"
    depends_on:
      - back
    restart: unless-stopped

volumes:
  redis-data:
  audit-data:
