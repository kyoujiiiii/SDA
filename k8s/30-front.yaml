apiVersion: apps/v1
kind: Deployment
metadata:
  name: front
  namespace: bernhack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: front
  template:
    metadata:
      labels:
        app: front
    spec:
      containers:
        - name: front
          image: ghcr.io/kyoujiiiii/bernhack-front:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits:   { cpu: "200m", memory: "128Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: front
  namespace: bernhack
spec:
  selector:
    app: front
  ports:
    - port: 80
      targetPort: 80